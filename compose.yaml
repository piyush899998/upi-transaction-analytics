services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: upi
      POSTGRES_PASSWORD: upi_local_dev
      POSTGRES_DB: upi_analytics
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upi -d upi_analytics"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://upi:upi_local_dev@db:5432/upi_analytics
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "upi_analytics.cli", "scheduler"]
    restart: unless-stopped
  dashboard:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://upi:upi_local_dev@db:5432/upi_analytics
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    command: ["streamlit", "run", "src/upi_analytics/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    restart: unless-stopped
volumes:
  pgdata:
