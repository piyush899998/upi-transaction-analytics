[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upi-transaction-analytics"
version = "1.0.0"
description = "Reproducible simulated UPI transaction ETL, monitoring, and alerting"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2", "pandas>=2.1,<3", "plotly>=5.20,<7"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
upi-analytics = "upi_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
